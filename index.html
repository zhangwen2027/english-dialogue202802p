<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语对话记忆·挖空练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .player-container {
            width: 100%;
            max-width: 900px;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            position: relative;
        }
        
        .video-screen {
            position: relative;
            width: 100%;
            height: 500px;
            background: #000;
            overflow: hidden;
        }
        
        /* 图片 - 总宽度为10份，左右各缩小 */
        .scene-image {
            position: absolute;
            width: 100%;
            height: 115%;
            top: -5%;
            left: 0;
            object-fit: cover;
            object-position: center 30%;
            z-index: 1;
            background: #000;
        }
        
        /* 顶部渐变透明层 */
        .top-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));
            z-index: 5;
            pointer-events: none;
        }
        
        /* 左右边缘模糊渐变 */
        .edge-fade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, 
                rgba(0,0,0,0.3) 0%, 
                rgba(0,0,0,0.1) 5%,
                rgba(0,0,0,0) 10%, 
                rgba(0,0,0,0) 90%, 
                rgba(0,0,0,0.1) 95%,
                rgba(0,0,0,0.3) 100%);
            z-index: 4;
            pointer-events: none;
        }
        
        .header {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 12px;
            z-index: 30;
            pointer-events: none;
        }
        
        .header h1 {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 1px;
            font-weight: bold;
        }
        
        .header p {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.65);
            font-weight: bold;
        }
        
        .scene-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 10;
        }
        
        .subtitle-layer {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.25);
            color: rgba(255, 255, 255, 0.95);
            padding: 10px 18px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
            z-index: 10;
            display: none;
        }
        
        .subtitle-layer.show {
            display: block;
        }
        
        .subtitle-english {
            font-size: 1.3rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.95);
        }
        
        .subtitle-chinese {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 3px;
            font-weight: bold;
        }
        
        .blank {
            display: inline-block;
            min-width: 60px;
            border-bottom: 2px solid #FFD700;
            margin: 0 2px;
            color: #FFD700;
            font-weight: bold;
        }
        
        .blank-filled {
            color: #FFD700;
            font-weight: bold;
        }
        
        .practice-area {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
        }
        
        .practice-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 1.1rem;
            border: 2px solid #FFD700;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            margin: 5px 0;
        }
        
        .practice-input:focus {
            outline: none;
            border-color: #e94560;
        }
        
        .practice-input.correct {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.2);
        }
        
        .practice-input.incorrect {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.2);
        }
        
        .result-feedback {
            padding: 8px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            margin-top: 5px;
            display: none;
        }
        
        .result-feedback.show {
            display: block;
        }
        
        .result-feedback.correct {
            background: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
        }
        
        .result-feedback.incorrect {
            background: rgba(233, 69, 96, 0.3);
            color: #e94560;
        }
        
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #2a2a2a;
            color: white;
            font-size: 0.8rem;
        }
        
        .progress-container {
            flex: 1;
            height: 4px;
            background: #444;
            border-radius: 2px;
            margin: 0 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: #e94560;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        .controls {
            display: flex;
            gap: 6px;
            justify-content: center;
            padding: 8px;
            background: #2a2a2a;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-mode { background: #FFD700; color: #333; }
        .btn-practice1 { background: #3498db; }
        .btn-practice2 { background: #9b59b6; }
        .btn-prev { background: #95a5a6; }
        .btn-next { background: #e94560; }
        .btn-speak { background: #ff6b6b; }
        .btn-record { background: #e74c3c; }
        .btn-check { background: #2ecc71; color: #333; }
        
        @media (max-width: 768px) {
            .video-screen {
                height: 300px;
            }
            .subtitle-english {
                font-size: 1rem;
            }
            .subtitle-chinese {
                font-size: 0.85rem;
            }
            .btn {
                padding: 6px 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="video-screen">
            <img class="scene-image" id="sceneImage" src="images/scene1.jpg.png" alt="场景">
            
            <!-- 顶部渐变透明层 -->
            <div class="top-gradient"></div>
            
            <!-- 左右边缘模糊渐变 -->
            <div class="edge-fade"></div>
            
            <div class="header">
                <h1>🎬 动漫对话记忆</h1>
                <p>人教版八上英语·假期对话</p>
            </div>
            
            <div class="scene-indicator" id="sceneIndicator">📍 场景1</div>
            
            <div class="subtitle-layer" id="subtitleLayer">
                <div class="subtitle-english" id="subtitleEnglish"></div>
                <div class="subtitle-chinese" id="subtitleChinese"></div>
            </div>
        </div>
        
        <div class="practice-area" id="practiceArea" style="display:none;">
            <input type="text" class="practice-input" id="practiceInput" placeholder="输入答案...">
            <div class="result-feedback" id="resultFeedback"></div>
        </div>
        
        <div class="info-bar">
            <span id="dialogueCounter">1 / 20</span>
            <div class="progress-container">
                <div class="progress-fill" id="progressFill" style="width: 5%"></div>
            </div>
            <span id="modeText">👀 观看模式</span>
        </div>
        
        <div class="controls">
            <button class="btn btn-mode" onclick="toggleMode()">👀 观看</button>
            <button class="btn btn-practice1" onclick="startPractice(1)">✍️ 练习1</button>
            <button class="btn btn-practice2" onclick="startPractice(2)">✍️ 练习2</button>
            <button class="btn btn-prev" onclick="prevDialogue()">⏮</button>
            <button class="btn btn-next" onclick="nextDialogue()">⏭</button>
            <button class="btn btn-speak" onclick="speakCurrent()">🔊</button>
            <button class="btn btn-record" onclick="startRecording()">🎤</button>
            <button class="btn btn-check" onclick="checkAnswer()">✓</button>
        </div>
    </div>

    <script>
        const dialogues = [
            { scene: 1, character: 'Adam', english: 'Hi, Peter. How are you?', chinese: '嗨，Peter。你好吗？' },
            { scene: 1, character: 'Peter', english: "Hi, Adam. I'm fine, thanks.", chinese: '嗨，Adam。我很好，谢谢。' },
            { scene: 1, character: 'Adam', english: 'How was your holiday?', chinese: '你的假期怎么样？' },
            { scene: 1, character: 'Peter', english: 'It was fantastic.', chinese: '太棒了。' },
            { scene: 2, character: 'Adam', english: 'Did you go anywhere interesting?', chinese: '你去了什么有趣的地方吗？' },
            { scene: 2, character: 'Peter', english: 'Yes, I went to Yunnan with my family.', chinese: '是的，我和家人去了云南。' },
            { scene: 3, character: 'Adam', english: 'Wow! That sounds great.', chinese: '哇！听起来很棒。' },
            { scene: 3, character: 'Adam', english: 'Did you go to Lijiang?', chinese: '你去了丽江吗？' },
            { scene: 3, character: 'Peter', english: 'Yes, we stayed in the old town for a few days, and we enjoyed it very much.', chinese: '是的，我们在古城住了几天，非常享受。' },
            { scene: 4, character: 'Adam', english: 'Did you visit Yulong Mountain?', chinese: '你去了玉龙雪山吗？' },
            { scene: 4, character: 'Adam', english: "Everyone says it's beautiful.", chinese: '大家都说那里很美。' },
            { scene: 4, character: 'Peter', english: 'It is! It just took my breath away.', chinese: '是的！太震撼了。' },
            { scene: 4, character: 'Peter', english: 'We took a lot of great photos there.', chinese: '我们在那里拍了很多好看的照片。' },
            { scene: 5, character: 'Adam', english: 'Did you eat anything special?', chinese: '你吃了什么特别的东西吗？' },
            { scene: 5, character: 'Peter', english: 'Yes, we did! Everything tasted good, especially the steamed chicken soup.', chinese: '是的！所有东西都很好吃，尤其是蒸鸡汤。' },
            { scene: 6, character: 'Peter', english: 'What about you?', chinese: '你呢？' },
            { scene: 6, character: 'Peter', english: 'Someone said you went to Beijing.', chinese: '有人说你去了北京。' },
            { scene: 6, character: 'Adam', english: 'No, not this holiday.', chinese: '不，这个假期没有。' },
            { scene: 6, character: 'Adam', english: 'I did nothing special.', chinese: '我什么都没做。' },
            { scene: 6, character: 'Adam', english: 'I just stayed at home to read, play games, and relax, but it was still fun.', chinese: '我只是待在家里看书、玩游戏、放松，但还是很有趣。' }
        ];
        
        const practice1Blanks = {
            4: { answer: 'Did you go anywhere interesting?' },
            7: { answer: 'Did you go to Lijiang?' },
            10: { answer: "Everyone says it's beautiful." },
            13: { answer: 'Did you eat anything special?' },
            16: { answer: 'Someone said you went to Beijing.' },
            18: { answer: 'I did nothing special.' }
        };
        
        const practice2Blanks = {
            4: { display: '_________________?', answer: 'Did you go anywhere interesting' },
            5: { display: 'Yes, I went to Yunnan _____________.', answer: 'with my family' },
            7: { display: '_______________?', answer: 'Did you go to Lijiang' },
            8: { display: 'Yes, we__________ the old town __________, and we enjoyed it very much.', answer: 'stayed / for a few days' },
            10: { display: '_________________.', answer: "Everyone says it's beautiful" },
            11: { display: 'It is! It just __________________.', answer: 'took my breath away' },
            13: { display: '_______ you____________?', answer: 'Did / eat anything special' },
            14: { display: 'Yes, we did! Everything____________, especially_____________.', answer: 'tasted good / the steamed chicken soup' },
            16: { display: '_____________ went to Beijing.', answer: 'Someone said you' },
            17: { display: 'No, ___________.', answer: 'not this holiday' },
            18: { display: 'I___________special.', answer: 'did nothing' },
            19: { display: 'I ____________read, play games, and relax, but it was still fun.', answer: 'just stayed at home to' }
        };
        
        const sceneImages = {
            1: 'images/scene1.jpg.png',
            2: 'images/scene2.jpg.png',
            3: 'images/scene3.jpg.png',
            4: 'images/scene4.jpg.png',
            5: 'images/scene5.jpg.png',
            6: 'images/scene6.jpg.png'
        };
        
        const sceneNames = {
            1: '场景1：打招呼',
            2: '场景2：云南高铁站',
            3: '场景3：丽江古城',
            4: '场景4：玉龙雪山',
            5: '场景5：菌菇火锅',
            6: '场景6：居家休闲'
        };
        
        let currentIndex = 0;
        let currentMode = 'watch';
        let currentAnswer = '';
        let mediaRecorder = null;
        let recordedChunks = [];
        
        function speak(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'en-US';
            speech.rate = 0.7;
            speech.pitch = 1;
            window.speechSynthesis.speak(speech);
        }
        
        function speakCurrent() {
            speak(dialogues[currentIndex].english);
        }
        
        function toggleMode() {
            currentMode = 'watch';
            document.getElementById('modeText').textContent = '👀 观看模式';
            document.getElementById('practiceArea').style.display = 'none';
            displayDialogue(currentIndex);
        }
        
        function startPractice(mode) {
            currentMode = mode === 1 ? 'practice1' : 'practice2';
            document.getElementById('modeText').textContent = mode === 1 ? '✍️ 练习1' : '✍️ 练习2';
            document.getElementById('practiceArea').style.display = 'block';
            document.getElementById('practiceInput').value = '';
            document.getElementById('resultFeedback').className = 'result-feedback';
            displayDialogue(currentIndex);
        }
        
        function displayDialogue(index) {
            const dialogue = dialogues[index];
            
            document.getElementById('sceneImage').src = sceneImages[dialogue.scene];
            document.getElementById('sceneIndicator').textContent = `📍 ${sceneNames[dialogue.scene]}`;
            
            let englishText = dialogue.english;
            let chineseText = `${dialogue.character}: ${dialogue.chinese}`;
            
            if (currentMode === 'practice1' && practice1Blanks[index]) {
                englishText = '<span class="blank">____________________</span>';
                currentAnswer = practice1Blanks[index].answer;
            } else if (currentMode === 'practice2' && practice2Blanks[index]) {
                englishText = practice2Blanks[index].display;
                currentAnswer = practice2Blanks[index].answer;
            } else {
                currentAnswer = '';
            }
            
            document.getElementById('subtitleEnglish').innerHTML = englishText;
            document.getElementById('subtitleChinese').textContent = chineseText;
            document.getElementById('subtitleLayer').classList.add('show');
            
            document.getElementById('dialogueCounter').textContent = `${index + 1} / ${dialogues.length}`;
            document.getElementById('progressFill').style.width = ((index + 1) / dialogues.length * 100) + '%';
        }
        
        function checkAnswer() {
            if (currentMode === 'watch') return;
            const userAnswer = document.getElementById('practiceInput').value.trim().toLowerCase();
            const correctAnswer = currentAnswer.toLowerCase();
            const input = document.getElementById('practiceInput');
            const feedback = document.getElementById('resultFeedback');
            
            if (userAnswer === correctAnswer) {
                input.className = 'practice-input correct';
                feedback.className = 'result-feedback show correct';
                feedback.textContent = `✅ 正确！答案：${currentAnswer}`;
            } else {
                input.className = 'practice-input incorrect';
                feedback.className = 'result-feedback show incorrect';
                feedback.textContent = `❌ 错误！正确答案：${currentAnswer}`;
            }
        }
        
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(blob);
                    const audio = new Audio(audioUrl);
                    audio.play();
                };
                
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 3000);
            } catch (error) {
                alert('无法访问麦克风');
            }
        }
        
        function nextDialogue() {
            if (currentIndex < dialogues.length - 1) currentIndex++;
            else currentIndex = 0;
            document.getElementById('practiceInput').value = '';
            document.getElementById('resultFeedback').className = 'result-feedback';
            displayDialogue(currentIndex);
            speakCurrent();
        }
        
        function prevDialogue() {
            if (currentIndex > 0) currentIndex--;
            else currentIndex = dialogues.length - 1;
            document.getElementById('practiceInput').value = '';
            document.getElementById('resultFeedback').className = 'result-feedback';
            displayDialogue(currentIndex);
            speakCurrent();
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextDialogue();
            if (e.key === 'ArrowLeft') prevDialogue();
            if (e.key === 'Enter' && currentMode !== 'watch') checkAnswer();
        });
        
        displayDialogue(0);
    </script>
</body>
</html>
